<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>D BOX Integration — Settings</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #121212; color: #ececec; color-scheme: dark;
         font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width: 580px; margin: 40px auto; padding: 0 16px; }
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .head img { width: 40px; height: 40px; border-radius: 10px; }
  h1 { font-size: 20px; font-weight: 500; margin: 0; color: #fff; }
  .tag { color: #3fd06f; font-style: italic; font-size: 13px; }
  .card { background: #1b1b1b; border: 1px solid #383838; border-radius: 10px; padding: 6px 20px 18px; }
  .cap { color: #3fd06f; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin: 16px 0 6px; }
  .hint { font-size: 12.5px; color: #8b8b8b; margin-top: 6px; }
  .hint b { color: #bdbdbd; font-weight: 600; }
  code { background: #252525; border-radius: 4px; padding: 1px 5px; font-size: 12px; }
  label.row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0;
    border-bottom: 1px solid #2b2b2b; cursor: pointer; }
  input[type=text] { width: 100%; height: 36px; padding: 0 11px; font: inherit; border: 1px solid #383838;
    border-radius: 6px; background: #1c1c1c; color: #ececec; outline: none; }
  input[type=text]:focus { border-color: #3fd06f; }
  input.switch { appearance: none; width: 38px; height: 22px; border-radius: 11px; background: #444; position: relative;
    margin: 0; flex: none; cursor: pointer; transition: background .15s; }
  input.switch::after { content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; border-radius: 50%;
    background: #eee; transition: left .15s; }
  input.switch:checked { background: #3fd06f; }
  input.switch:checked::after { left: 19px; background: #fff; }
  .bar { display: flex; gap: 10px; align-items: center; margin-top: 18px; }
  button { font: inherit; height: 36px; padding: 0 16px; border-radius: 6px; cursor: pointer;
    border: 1px solid #383838; background: #252525; color: #ececec; }
  button:hover { background: #2f2f2f; }
  button.primary { background: #3fd06f; border-color: #3fd06f; color: #07190d; font-weight: 600; }
  button.primary:hover { background: #55dd84; }
  #status { font-size: 13px; color: #bdbdbd; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <img src="icons/icon48.png" alt="">
    <div><h1>D BOX Integration</h1><div class="tag">Download anything</div></div>
  </div>
  <div class="card">
    <p class="hint">Categories, save folders and the download engine all live in <b>D BOX</b>. This extension
      captures downloads, adds the Download button to videos, and opens D BOX's New download window.</p>

    <label class="row"><span>Capture downloads<br><span class="hint">Send the browser's downloads to D BOX</span></span>
      <input type="checkbox" class="switch" id="enabled"></label>

    <div class="cap">D BOX address</div>
    <input type="text" id="myidmBase" placeholder="http://127.0.0.1:8081">
    <div class="hint">Must match D BOX's <code>-listen</code> address (default <code>127.0.0.1:8081</code>).</div>

    <div class="bar">
      <button class="primary" id="save">Save</button>
      <button id="test">Test connection</button>
      <span id="status"></span>
    </div>
  </div>
</div>
<script src="options.js"></script>
</body>
</html>
