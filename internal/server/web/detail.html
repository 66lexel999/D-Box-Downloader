<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Download status — D BOX</title>
<link rel="stylesheet" href="/ui/base.css">
<script src="/ui/ui.js"></script>
<style>
  html, body { height: 100%; }
  body { background: var(--modal); display: flex; flex-direction: column; overflow: hidden; }
  .hero { display: flex; align-items: center; gap: 14px; padding: 16px 20px 12px; flex: none; }
  .hero .ctile { border-radius: 10px; }
  .hero-text { flex: 1; min-width: 0; }
  .fname { font-size: 16px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .url { color: var(--muted); font-size: 12.5px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prog { padding: 0 20px; flex: none; }
  .prog-top { display: flex; align-items: baseline; gap: 10px; }
  .pct { font-size: 28px; font-weight: 300; color: var(--text); font-variant-numeric: tabular-nums; }
  .speed { margin-left: auto; color: var(--accent); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .bigbar { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; margin: 6px 0 12px; }
  .bigbar > div { height: 100%; width: 0; border-radius: 4px; transition: width .3s; background-color: var(--accent);
    background-image: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
    background-size: 90px 100%; background-repeat: no-repeat; background-position: -90px 0; }
  /* Shimmer only while data is flowing; a paused/failed bar sits still and dims. */
  .bigbar > div.live { animation: shimmer 1.5s linear infinite; }
  .bigbar > div.stale { background-color: var(--faint); background-image: none; }
  @keyframes shimmer { from { background-position: -90px 0; } to { background-position: 520px 0; } }
  .kv { display: grid; grid-template-columns: auto minmax(0, 1fr) auto minmax(0, 1fr); gap: 6px 14px; font-size: 13px; margin-bottom: 12px; }
  .kv .k { color: var(--muted); white-space: nowrap; }
  .kv .v { color: var(--text); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kv .v.wide { grid-column: 2 / -1; }
  .conns { flex: 1; min-height: 0; margin: 0 20px; display: flex; flex-direction: column; }
  .conn-cap { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12px;
    font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 6px; }
  .conn-n { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .segbar { position: relative; height: 10px; border-radius: 5px; background: var(--track); overflow: hidden; margin-bottom: 8px; flex: none; }
  .segbar:empty { display: none; }
  .segbar .seg { position: absolute; top: 0; bottom: 0; border-right: 2px solid var(--modal); }
  .segbar .seg .fill { height: 100%; background: var(--accent); opacity: .85; }
  .ctable { flex: 1; min-height: 0; overflow: auto; border: 1px solid var(--border-soft); border-radius: 8px; }
  table.ct { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.ct th { position: sticky; top: 0; background: var(--panel-head); color: var(--text-2); text-align: left; font-weight: 400;
    padding: 6px 12px; border-bottom: 1px solid var(--border-soft); }
  table.ct td { padding: 5px 12px; border-bottom: 1px solid var(--border-soft); color: var(--text-2); font-variant-numeric: tabular-nums; }
  table.ct tr:last-child td { border-bottom: 0; }
  table.ct .n { width: 44px; color: var(--muted); }
  table.ct .dl { width: 110px; }
  .info-recv { color: var(--accent) !important; }
  .info-idle { color: var(--muted) !important; }
  .info-err { color: var(--danger) !important; }
  .foot { flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 20px 16px; margin-top: 12px; border-top: 1px solid var(--border-soft); }
  .foot .grow { flex: 1; }
  #cancel { color: var(--danger); }
  #cancel:hover { background: var(--danger-dim); }
  .confirm-body { display: flex; align-items: flex-start; gap: 14px; padding: 18px 18px 14px; }
  .confirm-body .cmsg { color: var(--text); padding-top: 6px; }
</style>
</head>
<body>
  <div class="hero">
    <span id="ftile"></span>
    <div class="hero-text">
      <div class="fname" id="fname">…</div>
      <div class="url selectable" id="url"></div>
    </div>
    <span class="pill" id="status">…</span>
  </div>

  <div class="prog">
    <div class="prog-top"><span class="pct" id="pct">0%</span><span class="hint" id="downloaded"></span><span class="speed" id="rate"></span></div>
    <div class="bigbar"><div id="pbar"></div></div>
    <div class="kv">
      <span class="k">File size</span><span class="v" id="size"></span>
      <span class="k">Time left</span><span class="v" id="eta"></span>
      <span class="k">Speed</span><span class="v wide" id="rateStats"></span>
    </div>
  </div>

  <div class="conns">
    <div class="conn-cap"><span>Connections</span><span class="conn-n"><span id="connCount"></span> · resumable: <span id="resume"></span></span></div>
    <div class="segbar" id="segbar"></div>
    <div class="ctable">
      <table class="ct">
        <thead><tr><th class="n">#</th><th class="dl">Downloaded</th><th>Info</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <div class="foot">
    <button class="btn" id="cancel"><i data-ic="trash" data-sz="17"></i>Cancel download</button>
    <span class="grow"></span>
    <button class="btn" id="close">Close</button>
    <button class="btn" id="pause"><i data-ic="pause" data-sz="16"></i>Pause</button>
    <button class="btn btn-primary" id="resumeBtn"><i data-ic="play" data-sz="16"></i>Resume</button>
  </div>

  <div class="modal-backdrop" id="cfWrap">
    <div class="modal" style="width: 340px;">
      <div class="confirm-body"><span class="tone-badge tone-warn"><i data-ic="warn" data-sz="20"></i></span><div class="cmsg">Cancel this download and delete what was downloaded so far?</div></div>
      <div class="modal-foot"><button class="btn" id="cfNo">Keep it</button><button class="btn btn-danger" id="cfYes">Delete</button></div>
    </div>
  </div>

<script>
DBOX.hydrate(document);
const id = new URLSearchParams(location.search).get("id") || "";
const $ = (s) => document.getElementById(s);
const openedAt = Date.now();
let timer = null, closeTimer = null;
function humanBytes(n){ if(n==null||n<0)return "0 B"; const u=["B","KB","MB","GB","TB"];let i=0;
  while(n>=1024&&i<u.length-1){n/=1024;i++;} return n.toFixed(i?(n>=100?1:2):0)+" "+u[i]; }
function humanETA(s){ if(s==null||s<0||!isFinite(s))return "—"; s=Math.round(s);
  if(s<60)return s+" sec"; if(s<3600)return Math.floor(s/60)+" min "+(s%60)+" sec";
  return Math.floor(s/3600)+" hr "+Math.floor((s%3600)/60)+" min"; }
function api(method, path, body){ return fetch(path,{ method,
  headers: body?{"Content-Type":"application/json"}:undefined, body: body?JSON.stringify(body):undefined }); }
function stopTimers(){ if(timer){clearInterval(timer);timer=null;} if(closeTimer){clearInterval(closeTimer);closeTimer=null;} }
function closeSelf(){ stopTimers();
  try { if (window.parent !== window && window.parent.myidmDialogClosed) { window.parent.myidmDialogClosed(); return; } } catch(_) {}
  if(typeof window.myidmCloseDialog==="function") window.myidmCloseDialog(); else window.close(); }
// User hit Close/Cancel/Esc: dismiss this window AND its sibling (the completion
// popup for the same download) by stamping a close time the sibling polls for.
function closeAll(){ try { api("POST","/api/popups/"+id+"/close",{at:Date.now()}); } catch(_) {} closeSelf(); }
// The sibling popup closed if its POSTed time is newer than when we opened.
async function pollClose(){ try { const r = await fetch("/api/popups/"+id+"/close");
  const d = await r.json(); if ((d.at||0) > openedAt) closeSelf(); } catch(_) {} }

// Category tile in the header, from the folder the download is saved in.
let dirToCat = {}, tileCat = "";
fetch("/api/categories").then(r => r.json()).then(d => {
  for (const c of (d.categories || [])) dirToCat[String(c.dir || "").replace(/\\/g, "/").replace(/\/+$/, "").toLowerCase()] = c.name;
}).catch(() => {});
function setTile(t){
  const cat = dirToCat[String(t.dir || "").replace(/\\/g, "/").replace(/\/+$/, "").toLowerCase()] || "General";
  if (cat !== tileCat) { tileCat = cat; $("ftile").innerHTML = DBOX.catTile(cat, 44); }
}
const STATUS = { downloading: ["Downloading", "green"], queued: ["Waiting for a slot", ""], paused: ["Paused", ""],
  completed: ["Completed", "green"], failed: ["Error", "red"], scheduled: ["Scheduled", "warn"] };

function infoFor(t, seg){
  if (t.status === 'completed') return ['Complete','info-recv'];
  const len = seg.end - seg.start + 1;
  if (seg.end >= 0 && seg.done >= len) return ['Complete','info-recv'];
  if (t.status === 'downloading') return [t.note || 'Receiving data…','info-recv'];
  if (t.status === 'paused') return ['Paused','info-idle'];
  if (t.status === 'failed') return ['Disconnect.','info-err'];
  if (t.status === 'queued') return ['Waiting…','info-idle'];
  return ['—','info-idle'];
}

function renderSegbar(t){
  if (!t.size || t.size <= 0 || !(t.segments||[]).length) { $("segbar").innerHTML = ""; return; }
  let html = "";
  for (const s of t.segments) {
    const len = s.end - s.start + 1;
    const left = (s.start / t.size) * 100, width = (len / t.size) * 100;
    const fill = Math.min(100, (s.done / len) * 100);
    html += `<div class="seg" style="left:${left}%;width:${width}%"><div class="fill" style="width:${fill}%"></div></div>`;
  }
  $("segbar").innerHTML = html;
}

async function tick(){
  let t;
  try { const r = await fetch("/api/tasks/"+id); if(!r.ok) throw r.status; t = await r.json(); }
  catch(err) {
    // 404 = the task was deleted (e.g. cancelled from the main window): stop
    // polling a dead id forever and gray the controls. Network hiccups (the app
    // restarting) keep polling and recover on the next tick.
    if (err === 404) {
      $("status").textContent = "Removed"; $("status").className = "pill red";
      $("pause").disabled = $("resumeBtn").disabled = $("cancel").disabled = true;
      if (timer) { clearInterval(timer); timer = null; }
      const bar = $("pbar"); bar.classList.remove("live"); bar.classList.add("stale");
    }
    return;
  }

  const pct = t.progress >= 0 ? (t.progress*100) : 0;
  document.title = (t.status==='downloading' ? Math.round(pct)+"% " : "") + (t.fileName || "Download status");
  setTile(t);
  $("fname").textContent = t.fileName || "(resolving…)"; $("fname").title = t.fileName || "";
  const failed = t.status === 'failed' && t.error;
  $("url").textContent = failed ? t.error : t.url; $("url").title = failed ? t.error : t.url;
  $("url").style.color = failed ? "var(--danger)" : "";
  const [stText, stCls] = STATUS[t.status] || [t.status, ""];
  $("status").textContent = t.status === 'downloading' && t.note ? t.note : stText;
  $("status").className = "pill " + stCls;
  $("size").textContent = t.size>0 ? ((t.sizeEstimated && t.status!=='completed' ? "~" : "") + humanBytes(t.size))
    : (t.live ? "live stream" : "unknown");
  $("downloaded").textContent = humanBytes(t.downloaded) + (t.size>0 ? " of " + humanBytes(t.size) : " received");
  $("rate").textContent = t.status==='downloading' ? humanBytes(t.speed)+"/s" : "";
  const rate = (v) => v>0 ? humanBytes(v)+"/s" : "—";
  $("rateStats").textContent = (t.speedMax>0)
    ? `${rate(t.speedAvg)} average · ${rate(t.speedMax)} max · ${rate(t.speedMin)} min` : "—";
  $("eta").textContent = t.status==='downloading' ? humanETA(t.eta) : "—";
  $("resume").textContent = t.ranged ? "yes" : "no";
  const bar = $("pbar");
  bar.style.width = (t.size > 0 || t.status === 'completed' ? Math.min(100, t.status === 'completed' ? 100 : pct) : 0) + "%";
  bar.classList.toggle("live", t.status==='downloading');
  bar.classList.toggle("stale", t.status==='paused' || t.status==='failed');
  $("pct").textContent = t.status === 'completed' ? "100%" : (t.size > 0 ? (pct >= 100 ? "100" : pct.toFixed(1)) + "%" : (t.live ? "Live" : "—"));

  const active = t.status==='downloading' || t.status==='queued';
  const stopped = t.status==='paused' || t.status==='failed';
  $("pause").disabled = !active; $("pause").style.display = active ? "" : "none";
  $("resumeBtn").disabled = !stopped; $("resumeBtn").style.display = stopped ? "" : "none";
  $("cancel").style.display = t.status === 'completed' ? "none" : "";
  const n = (t.segments||[]).length || 1;
  $("connCount").textContent = n + " connection" + (n === 1 ? "" : "s");

  renderSegbar(t);
  $("rows").innerHTML = (t.segments||[]).map((s,i)=>{
    const [info,cls] = infoFor(t,s);
    return `<tr><td class="n">${i+1}</td><td class="dl">${humanBytes(s.done)}</td><td class="${cls}">${info}</td></tr>`;
  }).join("") || (() => { const [info, cls] = infoFor(t, { start: 0, end: -1, done: t.downloaded });
    return `<tr><td class="n">1</td><td class="dl">${humanBytes(t.downloaded)}</td><td class="${cls}">${info}</td></tr>`; })();
}

$("pause").addEventListener("click", () => api("POST","/api/tasks/"+id+"/pause"));
$("resumeBtn").addEventListener("click", () => api("POST","/api/tasks/"+id+"/resume"));
// In-window confirm instead of the browser's "127.0.0.1 says" dialog.
const cfOpen = () => $("cfWrap").classList.contains("show");
const cfHide = () => $("cfWrap").classList.remove("show");
$("cancel").addEventListener("click", () => { $("cfWrap").classList.add("show"); $("cfYes").focus(); });
$("cfNo").addEventListener("click", cfHide);
$("cfWrap").addEventListener("click", (e) => { if (e.target === $("cfWrap")) cfHide(); });
$("cfYes").addEventListener("click", () => { cfHide(); api("DELETE","/api/tasks/"+id+"?file=1"); closeAll(); });
$("close").addEventListener("click", closeAll);
// Escape peels one layer: the confirm first, then the window itself.
document.addEventListener("keydown", (e)=>{ if(e.key==="Escape"){ if(cfOpen()) cfHide(); else closeAll(); } });

tick();
timer = setInterval(tick, 700);
closeTimer = setInterval(pollClose, 300);
</script>
<script>
/* Reveal the native window only after first paint (parked off-screen until then
   by the gui layer) so the status window never flashes white/black on open. */
(function () {
  function ready() { try { window.myidmReady && window.myidmReady(); } catch (e) {} }
  function arm() { requestAnimationFrame(function () { requestAnimationFrame(ready); }); }
  if (document.readyState === 'loading') addEventListener('DOMContentLoaded', arm);
  else arm();
})();
</script>
<div id="wsz"><span id="wsz-t"></span><span id="wsz-x" title="Hide — Ctrl+Alt+W to toggle">&#10005;</span></div>
<script>
(function(){var N=3,K="dbox.wsz.show";
var b=document.getElementById("wsz"),t=document.getElementById("wsz-t"),x=document.getElementById("wsz-x");
function shown(){try{return localStorage.getItem(K)==="1";}catch(e){return false;}}
function apply(){b.style.display=shown()?"":"none";}
function dpr(){return Math.round((window.devicePixelRatio||1)*100)/100;}
function upd(){t.textContent="#"+N+"  "+window.innerWidth+" × "+window.innerHeight+"  · ×"+dpr();}
function toggle(){try{localStorage.setItem(K,shown()?"0":"1");}catch(e){}apply();}
x.addEventListener("click",toggle);
window.addEventListener("resize",upd);
window.addEventListener("keydown",function(e){if(e.ctrlKey&&e.altKey&&(e.key==="w"||e.key==="W")){e.preventDefault();toggle();}});
upd();apply();window.__wszToggle=toggle;
})();
</script>
</body>
</html>
